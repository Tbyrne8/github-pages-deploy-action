deploy:
  needs: build
  runs-on: ubuntu-latest
  timeout-minutes: 10

  permissions:
    pages: write
    id-token: write

  environment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}

  steps:
    - id: deployment
      uses: actions/deploy-pages@v4
      with:
        timeout: 600000
